<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>旅の栞 | Tabi no Shiori</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ==================== 認証画面 ==================== -->
<div id="authScreen" class="auth-screen">
  <div class="passport-cover">
    <div class="passport-emblem">旅</div>
    <h1 class="passport-title">旅の栞</h1>
    <p class="passport-sub">TABI NO SHIORI &mdash; Travel Log</p>

    <form id="authForm" class="auth-form">
      <input type="email" id="authEmail" placeholder="メールアドレス" required autocomplete="email">
      <input type="password" id="authPassword" placeholder="パスワード（6文字以上）" required autocomplete="current-password" minlength="6">
      <input type="text" id="authName" placeholder="表示名（はじめての方のみ）" autocomplete="nickname">
      <div id="authError" class="auth-error"></div>
      <button type="submit" class="btn-stamp" id="authSubmitBtn">はじめる</button>
      <button type="button" class="btn-link" id="authToggleBtn">新規登録の方はこちら</button>
    </form>
  </div>
</div>

<!-- ==================== メイン画面 ==================== -->
<div id="appScreen" class="app-screen" hidden>

  <header class="topbar">
    <div class="topbar-brand">
      <span class="brand-mark">旅</span>
      <span class="brand-text">旅の栞</span>
    </div>
    <button class="btn-user" id="userMenuBtn">
      <span id="userDisplayName">ゲスト</span>
      <span class="chevron">▾</span>
    </button>
  </header>

  <main class="content">

    <section class="map-panel">
      <div id="map"></div>
      <div class="map-legend">
        <div class="legend-row"><span class="dot dot-planned"></span>行きたい</div>
        <div class="legend-row"><span class="dot dot-visited"></span>行った</div>
        <div class="legend-row"><span class="dot dot-ai"></span>周辺スポット</div>
      </div>
    </section>

    <section class="card input-card" id="inputCard">
      <h2 class="section-title">行きたい場所を追加</h2>
      <form id="placeForm" class="place-form">
        <div class="field-row">
          <input type="text" id="inputPlace" placeholder="例：金閣寺、北海道" required>
          <button type="button" class="btn-outline" id="showOnMapBtn">地図で確認</button>
        </div>

        <div class="nearby-grid">
          <button type="button" class="btn-chip chip-gourmet" data-type="restaurant">🍜 周辺グルメ</button>
          <button type="button" class="btn-chip chip-spot" data-type="tourist_attraction">📷 観光スポット</button>
          <button type="button" class="btn-chip chip-hotel" data-type="lodging">🏨 周辺ホテル</button>
          <button type="button" class="btn-chip chip-souvenir" data-type="store">🎁 お土産店</button>
        </div>

        <div id="nearbyResults" class="nearby-results" hidden>
          <div class="nearby-results-title" id="nearbyResultsTitle"></div>
          <ul id="nearbyResultsList" class="nearby-list"></ul>
        </div>

        <div class="field-row two-col">
          <input type="date" id="inputDate">
          <input type="text" id="inputTripTitle" list="albumList" placeholder="アルバム名（例：秋田旅行）">
          <datalist id="albumList"></datalist>
        </div>
        <textarea id="inputNote" rows="2" placeholder="メモ"></textarea>

        <button type="submit" class="btn-stamp full-width">＋ リストに追加</button>
      </form>
    </section>

    <nav class="tabs">
      <button class="tab active" id="tab-planned" data-tab="planned">行きたい</button>
      <button class="tab" id="tab-visited" data-tab="visited">アルバム（行った）</button>
    </nav>

    <section id="listContainer" class="list-container"></section>

  </main>

  <div id="routeBar" class="route-bar" hidden>
    <div class="route-bar-count"><span id="selectedCount">0</span> 箇所を選択中</div>
    <div class="route-bar-actions">
      <button class="btn-ghost" id="clearSelectionBtn">クリア</button>
      <button class="btn-stamp" id="buildRouteBtn">周遊ルートを作る</button>
    </div>
  </div>
</div>

<!-- ==================== 訪問記録モーダル ==================== -->
<div id="visitModal" class="modal-overlay" hidden>
  <div class="modal-box">
    <div class="modal-header">
      <h3 id="visitModalTitle">思い出を記録</h3>
      <button class="modal-close" data-close="visitModal">×</button>
    </div>
    <div class="modal-body">
      <label>場所の名前</label>
      <input type="text" id="visitPlace">
      <label>日付</label>
      <input type="date" id="visitDate">
      <label>アルバム名</label>
      <input type="text" id="visitTitle" list="albumList">
      <label>メモ</label>
      <textarea id="visitNote" rows="4"></textarea>
      <label>写真を追加（複数可）</label>
      <input type="file" id="visitPhoto" accept="image/*" multiple>
      <div id="existingPhotos" class="existing-photos"></div>
    </div>
    <div class="modal-footer">
      <button class="btn-ghost" data-close="visitModal">キャンセル</button>
      <button class="btn-stamp" id="confirmVisitBtn">保存する</button>
    </div>
  </div>
</div>

<!-- ==================== ギャラリーモーダル ==================== -->
<div id="galleryModal" class="modal-overlay gallery-overlay" hidden>
  <button class="modal-close light" data-close="galleryModal">×</button>
  <div class="gallery-track" id="galleryTrack"></div>
</div>

<div id="loadingOverlay" class="loading-overlay" hidden>
  <div class="stamp-spinner"></div>
  <div class="loading-text" id="loadingText">読み込み中…</div>
</div>

<script type="module" src="js/firebase-config.js"></script>
<script type="module" src="js/auth.js"></script>
<script type="module" src="js/places.js"></script>
<script type="module" src="js/map.js"></script>
<script type="module" src="js/app.js"></script>
<!-- ★ここにご自身のGoogle Maps APIキーを設定してください -->
<script async defer
  src="https://maps.googleapis.com/maps/api/js?key=YOUR_GOOGLE_MAPS_API_KEY&libraries=places&loading=async&callback=window.__gmapsReady">
</script>
</body>
</html>
